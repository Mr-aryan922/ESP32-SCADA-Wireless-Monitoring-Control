<!DOCTYPE html>
<html>
<head>
  <title>INDUSTRIAL DASHBOARD (preview)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background:#111; color:#0f0; font-family:Arial; }
    .card { padding:15px; margin:10px; border:1px solid #0f0; }
    canvas { background:#222; margin:10px; }
    .preview-banner { background:#552; color:#ff0; padding:8px 12px; margin:10px; border:1px dashed #ff0; font-size:13px; }
  </style>
</head>

<body>

<div class="preview-banner">PREVIEW ONLY: the values below are simulated in the browser. They are not sensor readings and not hardware evidence. On the real device the page fetches /data from the Receiver ESP32.</div>

<h1>ESP32 INDUSTRIAL DASHBOARD</h1>

<div class="card">Temp: <span id="temp">--</span></div>
<div class="card">Hum: <span id="hum">--</span></div>
<div class="card">Gas: <span id="gas">--</span></div>
<div class="card">IR1: <span id="ir1">--</span></div>
<div class="card">IR2: <span id="ir2">--</span></div>

<h2>Temperature Graph</h2>
<canvas id="tempChart"></canvas>

<h2>Gas Graph</h2>
<canvas id="gasChart"></canvas>

<script>
let tempData = [];
let gasData = [];
let labels = [];

const maxPoints = 20;

// TEMP CHART
const tempChart = new Chart(document.getElementById("tempChart"), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [{
      label: 'Temperature',
      data: tempData,
      borderColor: 'lime',
      fill: false
    }]
  }
});

// GAS CHART
const gasChart = new Chart(document.getElementById("gasChart"), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [{
      label: 'Gas',
      data: gasData,
      borderColor: 'red',
      fill: false
    }]
  }
});

// SIMULATED stand-in for fetch("/data") so the layout can be previewed
let sim = { temp: 25, hum: 50, gas: 300 };
function fakeFetch() {
  sim.temp += (Math.random() - 0.5) * 0.4;
  sim.hum += (Math.random() - 0.5) * 1.0;
  sim.gas += (Math.random() - 0.5) * 20;
  return Promise.resolve({ json: () => ({
    temp: sim.temp.toFixed(1), hum: sim.hum.toFixed(1), gas: Math.round(sim.gas),
    ir1: Math.random() > 0.8 ? 1 : 0, ir2: Math.random() > 0.8 ? 1 : 0 }) });
}

setInterval(() => {
  fakeFetch()
  .then(res => res.json())
  .then(d => {

    document.getElementById("temp").innerText = d.temp;
    document.getElementById("hum").innerText = d.hum;
    document.getElementById("gas").innerText = d.gas;
    document.getElementById("ir1").innerText = d.ir1;
    document.getElementById("ir2").innerText = d.ir2;

    let time = new Date().toLocaleTimeString();

    if(labels.length > maxPoints){
      labels.shift();
      tempData.shift();
      gasData.shift();
    }

    labels.push(time);
    tempData.push(d.temp);
    gasData.push(d.gas);

    tempChart.update();
    gasChart.update();
  });

}, 1000);
</script>

</body>
</html>
